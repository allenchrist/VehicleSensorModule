# Publishes a new version of the app, for sharing and updating.
#
# Start it from the repository's Actions tab: Release, then Run workflow.
# It builds the app, signs it with the release key kept in the repository's
# secrets, and publishes it as a GitHub Release. Phones with the app see
# "Update available" the next time it opens.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Each run is one version newer. Android Studio builds are version 1.
      - name: Version number
        run: |
          echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The key never appears in the repository or the log
      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "The release key isn't in the repository's secrets. See the README."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build, check and sign
        run: sh ./gradlew :app:ktlintCheck :app:testDebugUnitTest :app:assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk connected-vehicle.apk
          gh release create "v$APP_VERSION_CODE" connected-vehicle.apk \
            --title "Connected Vehicle $APP_VERSION_NAME" \
            --notes "Version $APP_VERSION_NAME. Install connected-vehicle.apk, or open the app to update."
