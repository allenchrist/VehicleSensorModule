# Runs on every push: checks the code style, builds the app, then runs its
# unit tests and lint.
name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Code style
        run: sh ./gradlew :app:ktlintCheck
      - name: Build, unit tests and lint
        run: sh ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
